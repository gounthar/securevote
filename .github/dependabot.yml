# Dependabot configuration for SecureVote
# Keeps dependencies up-to-date automatically
# Documentation: https://docs.github.com/en/code-security/dependabot
#
# IMPORTANT: phase1 is INTENTIONALLY excluded from updates
# Phase1 contains vulnerabilities for educational purposes
# Only phase2 and phase3 are kept up-to-date

version: 2
updates:
  # Python dependencies (Backend Flask)
  # Note: phase1/backend excluded - intentionally vulnerable for teaching
  - package-ecosystem: "pip"
    directories:
      - "/phase2/backend"
      - "/phase3/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Node.js dependencies (Frontend React)
  # Note: phase1/frontend excluded - intentionally vulnerable for teaching
  - package-ecosystem: "npm"
    directories:
      - "/phase2/frontend"
      - "/phase3/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Docker images
  # Note: phase1 excluded - intentionally vulnerable for teaching
  - package-ecosystem: "docker"
    directories:
      - "/phase2/backend"
      - "/phase2/frontend"
      - "/phase3/backend"
      - "/phase3/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    ignore:
      # The python minor (3.14 -> 3.15) is moved by
      # updatecli/updatecli.d/python.yaml, which keeps each phase at a
      # fixed distance from the latest release. Patch tags still come here.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # The node major is moved by updatecli/updatecli.d/node.yaml, LTS
      # only: Dependabot cannot tell an LTS from a Current release.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions (if we add workflows later)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
